apiVersion: apps/v1 
kind: ReplicaSet 
metadata:
  name: new-replicaset 
  labels:
    project: roboshop 
    environment: dev 
spec:
  replicas: 2 
  selector:
    matchLabels:
      tier: frontend 
  template:
    metadata:
      labels:
        tier: frontend 
    spec:
      containers:
      - name: nginx 
        image: nginx 