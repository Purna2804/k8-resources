apiVersion: v1 
kind: Pod 
metadata:
  name: nginx-pod 
  labels:
    project: roboshop 
spec:
  containers:
  - name: nginx 
    image: nginx 
    
---
apiVersion: v1
kind: Service  
metadata:
  name: nginx-service 
spec:
  selector:
    project: roboshop 
  ports:
  - protocol: "TCP"
    port: 8080 
    targetPort: 8080 