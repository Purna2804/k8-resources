apiVersion: apps/v1 
kind: DaemonSet  
metadata:
  name: fluentd-elasticsearch 
  namespace: kube-system  
  labels:
    project: roboshop 
    k8s-app: fluentd-logging 
spec:
  selector:
    matchLabels:
      name: fluentd-elasticsearch
  template:
    metadata:
      labels:
        name: fluentd-elasticsearch 
    spec:
      containers:
      - name: fluentd-elasticsearch  
        image: quay.io/fluentd_elasticsearch/fluentd:v5.0.1
        resources:
          limits:
            memory: 200Mi 
            cpu: 500m 
          requests:
            cpu: 250m 
            memory: 100Mi 
        volumeMounts:
        - mountPath: /var/log  
          name: varlog  
          readOnly: true   
  volumes:
  - name: nginx-volume 
    hostPath:
      path: /var 
  