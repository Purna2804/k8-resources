apiVersion: v1 
kind: PersistentVolumeClaim 
metadata:
  name: ebs-dynamic 
spec:
  accessModes: "ReadWriteOnce"
  storageClassName: roboshop-ebs 
  resources:
    requests:
      storage: 2Gi 

---

apiVersion: v1 
kind: Pod 
metadata:
  name: nginx-pod 
spec:
  containers:
  - name: nginx 
    image: nginx 
    volumeMounts:
    - mountPath: /usr/share/nginx/html 
      name: persistent-volume 
      readOnly: true 
  volumes:
  - name: persistent-volume 
    persistentVolumeClaim:
      claimName: ebs-dynamic  