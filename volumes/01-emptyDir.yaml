apiVersion: v1 
kind: Pod 
metadata:
  name: nginx-pod 
  labels:
    project: roboshop 
    environment: dev 
    purpose: poc 
spec:
  containers:
  - name: nginx 
    images: nginx 
    volumeMounts:
    - mountPath: /usr/share/nginx/html 
      name: nginx-volume 
  - name: almalinux 
    image: almalinux:9 
    command: ["sleep", "1000"]
    volumeMounts:
    - mountPath: /mnt/nginx-logs 
      name: nginx-volume 
      readOnly: true 
  volumes:
  - name: nginx-volume 
    emptyDir:
      sizeLimit: 500Mi 
      