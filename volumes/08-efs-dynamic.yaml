apiVersion: v1 
kind: PersistentVolumeClaim 
metadata:
  name: efs-dynamic 
spec:
  accessModes: 
  - "ReadWriteMany"
  storageClassName: roboshop-efs 
  resources:
    requests:
      storage: 2Gi 

---

apiVersion: v1 
kind: Pod 
metadata:
  name: efs-dynamic 
spec:
  containers:
  - name: nginx 
    image: nginx 
    volumeMounts:
    - mountPath: /usr/share/nginx/html 
      name: persistent-storage 
      readOnly: true 
  volumes:
  - name: persistent-storage 
    persistentVolumeClaim:
      claimName: efs-dynamic 
