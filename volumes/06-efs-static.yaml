apiVersion: v1 
kind: PersistentStorage 
metadata:
  name: efs-static 
spec:
  accessModes:
  - ReadWriteMany 
  capacity:
    storage: 2Gi 
  volumeMode: Filesystem
  peristentVolumeReclaimPolicy: Retain 
  csi:
    driver: efs.csi.aws.com 
    volumeHandle: ""

---

apiVersion: v1 
kind: PersistentVolumeClaim 
metadata:
  name: efs-static 
spec:
  accessModes:
  - ReadWriteMany 
  resources:
    requests:
      storage: 2Gi 

---

apiVersion: v1 
kind: Pod 
metadata:
  name: efs-static 
spec:
  containers:
  - name: nginx 
    image: nginx 
    volumeMounts:
    - mountPath: /usr/share/nginx/html 
      name: persistent-storage 
  volumes:
  - name: persistent-storage 
    persistentVolumeClaim:
      claimName: efs-static 
  
