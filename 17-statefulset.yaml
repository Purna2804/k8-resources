apiVersion: v1
kind: Service 
metadata:
  name: headless-service 
  labels:
    app: nginx 
spec:
  clusterIP: None 
  selector:
    app: nginx  
  ports:
  - port: 80 
    name: web 

---

apiVersion: apps/v1 
kind: StatefulSet 
metadata:
   name: web 
spec:
  replicas: 1 
  serviceName: headless-service 
  selector:
    matchLabels:
      app: nginx 
  template:
    metadata:
      labels:
        app: nginx 
    spec:
      containers:
      - name: nginx 
        image: nginx 
        ports:
        - containerPort: 80 
          name: web 
        volumeMounts:
        - mountPath: /usr/share/nginx/html 
          name: web 
  volumeClaimTemplates:
  - metadata:
      name: web 
    spec:
      storageClassName: roboshop-ebs 
      accessModes: "ReadWriteOnce"
      resources:
        requests:
          storage: 2Gi 